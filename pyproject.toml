[project]
name = "fraud-detection-realtime"
version = "0.1.0"
description = "Detecção de fraude em transações financeiras em tempo real (FastAPI, Redis Streams, PostgreSQL, LightGBM híbrido)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis>=5.2",
    "structlog>=24.4",
    "prometheus-client>=0.21",
    "opentelemetry-api>=1.28",
    "opentelemetry-sdk>=1.28",
    "opentelemetry-exporter-otlp-proto-http>=1.28",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.49b0",
    "opentelemetry-instrumentation-redis>=0.49b0",
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "joblib>=1.4",
    "httpx>=0.27",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.50"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pandas-stubs>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fraud"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF", "ASYNC", "PT"]
ignore = [
    "RUF001", # docstrings/strings em português usam caracteres acentuados
    "RUF002",
    "RUF003",
    "B008",   # Depends() em defaults é o idioma do FastAPI
    "E501",   # comprimento de linha fica a cargo do formatador
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
files = ["src/fraud"]
exclude = ["src/fraud/dashboard/"]

[[tool.mypy.overrides]]
module = ["lightgbm.*", "sklearn.*", "joblib.*", "streamlit.*", "opentelemetry.instrumentation.*"]
ignore_missing_imports = true
follow_untyped_imports = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "integration: precisa de PostgreSQL e Redis reais (make test sobe os dois)",
    "adversarial: suíte de ataques contra o próprio modelo (Fase D)",
]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["src/fraud"]
omit = ["src/fraud/dashboard/*"]
